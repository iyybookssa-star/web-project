<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0f1123" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Glowing Blue Gradient for Stem -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#394ae2" />
    </linearGradient>

    <!-- Glowing Blue Gradient for Loop -->
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#394ae2" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#394ae2" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#394ae2" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark Circular Base -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" />

  <!-- Outer Tech Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="400 80 150 50" />

  <!-- The "P" character grouped with mask and glow -->
  <g filter="url(#glow)">
    <!-- Mask to slice the P diagonally -->
    <mask id="sliceMask">
      <rect x="0" y="0" width="512" height="512" fill="white" />
      <!-- The diagonal slash (black cuts out) -->
      <rect x="-100" y="240" width="700" height="24" fill="black" transform="rotate(-30 256 256)" />
    </mask>

    <g mask="url(#sliceMask)">
      <!-- Vertical Stem of 'P' -->
      <rect x="145" y="110" width="60" height="292" rx="16" fill="url(#stemGrad)" />

      <!-- Loop of 'P' (Compound Path) -->
      <path d="M 200,110
               H 310
               C 385,110 445,170 445,245
               C 445,320 385,380 310,380
               H 200
               V 315
               H 310
               C 348.6,315 380,283.6 380,245
               C 380,206.4 348.6,175 310,175
               H 200
               Z"
            fill="url(#loopGrad)" />
    </g>
  </g>

  <!-- Small accent dot/light (adds premium tech aesthetic) -->
  <circle cx="310" cy="245" r="10" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)" />
</svg>
